<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0B1A">
<title>Community — CultureLens</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
<style>
  /* Community: posts as plain blocks on the paper, one after another */
  .page-wrap { padding: 26px 20px 28px; }
  .page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; padding-bottom: 18px; border-bottom: 1px solid var(--ink); }
  @media (max-width: 380px) { .page-title { font-size: 36px; } html[dir="rtl"] .page-title { font-size: 34px; } }
  .page-title { font-size: 42px; line-height: 1.02; font-weight: 800; }
  html[dir="rtl"] .page-title { font-size: 38px; line-height: 1.3; font-weight: 700; }
  .page-head-sub { margin-top: 8px; font-size: 15px; color: var(--ink-2); }
  .new-post-btn { flex-shrink: 0; display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 16px; border-radius: var(--r); background: var(--acc); color: var(--paper); font-size: 14px; font-weight: 650; }
  .new-post-btn svg { width: 16px; height: 16px; }

  .post-card { padding: 20px 0; border-bottom: 1px solid var(--rule); }
  .post-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .avatar { width: 40px; height: 40px; flex-shrink: 0; display: grid; place-items: center; border-radius: 50%; background: var(--night); color: var(--logo-cream); font-size: 14px; font-weight: 700; }
  .post-meta { min-width: 0; }
  .post-user { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 15px; font-weight: 700; }
  .region-pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border: 1px solid var(--rule); border-radius: var(--r); font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
  .region-pill::before { content: ''; width: 6px; height: 6px; background: var(--acc); }
  .post-time { font-size: 12.5px; color: var(--ink-3); margin-top: 1px; }
  .post-text { font-size: 15.5px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
  .post-image, .post-video { margin-top: 14px; border-radius: var(--r); overflow: hidden; background: var(--paper-3); }
  .post-image img { width: 100%; height: auto; max-height: 420px; object-fit: cover; }
  .post-video iframe, .post-video video { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; background: #000; }
  .post-audio { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: var(--r); }
  .post-audio svg { width: 20px; height: 20px; color: var(--ink-2); flex-shrink: 0; }
  .post-audio audio { flex: 1; min-width: 0; height: 36px; }
  .post-actions { display: flex; gap: 22px; margin-top: 14px; }
  .action-btn { display: inline-flex; align-items: center; gap: 7px; height: 32px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
  .action-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round; }
  .action-btn.liked { color: var(--acc); }
  .action-btn.liked svg { fill: currentColor; }
  .comments { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--rule-2); }
  .comments.open { display: block; }
  .comment { display: flex; gap: 10px; margin-bottom: 12px; }
  .comment .avatar { width: 30px; height: 30px; font-size: 11px; background: var(--paper-3); color: var(--ink); }
  .comment-user { font-size: 13px; font-weight: 700; }
  .comment-text { font-size: 14px; line-height: 1.5; color: var(--ink-2); }
  .comment-input-row { display: flex; gap: 8px; margin-top: 4px; }
  .comment-input { flex: 1; min-width: 0; height: 40px; padding: 0 12px; border: 1px solid var(--rule); border-radius: var(--r); background: #FBF8F2; color: var(--ink); font: inherit; font-size: 14px; }
  .comment-send { height: 40px; padding: 0 14px; border-radius: var(--r); background: var(--ink); color: var(--paper); font-size: 13.5px; font-weight: 650; }

  /* the composer: a sheet from the bottom */
  .composer-overlay { position: fixed; inset: 0; z-index: 300; display: none; align-items: flex-end; justify-content: center; background: rgba(14, 11, 26, 0.55); }
  .composer-overlay.open { display: flex; }
  .composer { width: 100%; max-width: 430px; max-height: 92dvh; overflow-y: auto; padding: 18px 18px calc(18px + var(--safe-b)); background: var(--paper); border-radius: 4px 4px 0 0; }
  .composer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .composer-title { font-size: 22px; font-weight: 750; letter-spacing: -0.015em; }
  html[dir="rtl"] .composer-title { letter-spacing: 0; }
  .composer-close { width: 36px; height: 36px; display: grid; place-items: center; color: var(--ink-2); }
  .composer-close svg { width: 20px; height: 20px; }
  #composer-text { width: 100%; min-height: 120px; padding: 12px; border: 1px solid var(--rule); border-radius: var(--r); background: #FBF8F2; color: var(--ink); font: inherit; font-size: 15px; line-height: 1.55; resize: vertical; }
  .composer-row { margin-top: 10px; }
  .region-select, .video-url-input { width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--rule); border-radius: var(--r); background: #FBF8F2; color: var(--ink); font: inherit; font-size: 14.5px; }
  .media-upload-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .img-upload-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 42px; border: 1px solid var(--rule); border-radius: var(--r); font-size: 13.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; overflow: hidden; }
  .img-upload-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .img-upload-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .img-preview { position: relative; display: none; margin-top: 10px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--rule); }
  .img-preview.show { display: block; }
  .img-preview img { display: block; width: 100%; height: auto; max-height: 260px; object-fit: cover; }
  .img-preview video { display: block; width: 100%; max-height: 260px; background: #000; }
  .img-preview .audio-wrap { padding: 12px; }
  .img-preview audio { display: block; width: 100%; }
  .img-remove { position: absolute; top: 8px; inset-inline-end: 8px; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: var(--night); color: var(--logo-cream); }
  .img-remove svg { width: 16px; height: 16px; }
  .composer-submit { width: 100%; height: 50px; margin-top: 14px; border-radius: var(--r); background: var(--acc); color: var(--paper); font-size: 16px; font-weight: 650; }
</style>
</head>
<body class="cl-app">

<header class="cl-header">
  <div class="hdr-start">
    <a href="index.html" class="back-btn" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <a class="brand is-mark" href="index.html" aria-label="CultureLens"><img src="logo-mark.svg" alt=""></a>
  </div>
  <div class="hdr-actions">
    <button id="lang-toggle" type="button" onclick="toggleLanguage()"><span id="lang-label">العربية</span></button>
  </div>
</header>

<main class="page-wrap">
  <div class="page-head">
    <div>
      <h1 class="page-title translatable" data-en="Community" data-ar="المجتمع">Community</h1>
      <div class="page-head-sub translatable" data-en="Share your culture, stories & moments" data-ar="شارك ثقافتك وقصصك ولحظاتك">Share your culture, stories & moments</div>
    </div>
    <button class="new-post-btn" type="button" onclick="openComposer()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="translatable" data-en="New post" data-ar="منشور جديد">New post</span></button>
  </div>

  <div id="feed"></div>
</main>

<!-- ── COMPOSER OVERLAY ── -->
<div class="composer-overlay" id="composer-overlay">
  <div class="composer">
    <div class="composer-head">
      <div class="composer-title translatable" data-en="Create Post" data-ar="منشور جديد">Create Post</div>
      <button class="composer-close" type="button" onclick="closeComposer()" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <textarea id="composer-text" class="translatable" data-en-placeholder="What's on your mind?" data-ar-placeholder="وش يدور ببالك؟" placeholder="What's on your mind?"></textarea>

    <div class="composer-row">
      <select id="composer-region" class="region-select">
        <option value="" disabled selected class="translatable" data-en="Select your region..." data-ar="اختر منطقتك...">Select your region...</option>
        <option value="Riyadh">Riyadh — الرياض</option>
        <option value="Makkah">Makkah — مكة المكرمة</option>
        <option value="Madinah">Madinah — المدينة المنورة</option>
        <option value="Eastern Province">Eastern Province — المنطقة الشرقية</option>
        <option value="Asir">Asir — عسير</option>
        <option value="Tabuk">Tabuk — تبوك</option>
        <option value="Hail">Hail — حائل</option>
        <option value="Northern Borders">Northern Borders — الحدود الشمالية</option>
        <option value="Jizan">Jizan — جازان</option>
        <option value="Najran">Najran — نجران</option>
        <option value="Al Bahah">Al Bahah — الباحة</option>
        <option value="Al Jawf">Al Jawf — الجوف</option>
        <option value="Qassim">Qassim — القصيم</option>
      </select>

    </div>

    <div class="media-upload-row">
      <label class="img-upload-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg><span class="translatable" data-en="Photo" data-ar="صورة">Photo</span>
        <input type="file" id="composer-image" accept="image/*" onchange="previewMedia(event,'image')">
      </label>
      <label class="img-upload-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg><span class="translatable" data-en="Video" data-ar="فيديو">Video</span>
        <input type="file" id="composer-video" accept="video/*" onchange="previewMedia(event,'video')">
      </label>
      <label class="img-upload-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg><span class="translatable" data-en="Audio" data-ar="صوت">Audio</span>
        <input type="file" id="composer-audio" accept="audio/*" onchange="previewMedia(event,'audio')">
      </label>
    </div>

    <input type="url" id="composer-youtube" class="video-url-input translatable"
      data-en-placeholder="Or paste a YouTube link…"
      data-ar-placeholder="أو الصق رابط يوتيوب…"
      placeholder="Or paste a YouTube link…">

    <div class="img-preview" id="img-preview">
      <img id="img-preview-el" alt="Preview" style="display:none">
      <video id="video-preview-el" controls playsinline style="display:none"></video>
      <div class="audio-wrap" id="audio-preview-wrap" style="display:none">
        <audio id="audio-preview-el" controls></audio>
      </div>
      <button class="img-remove" type="button" onclick="removePreview()" aria-label="Remove media"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <button class="composer-submit translatable" type="button" onclick="submitPost()" data-en="Post" data-ar="نشر">Post</button>
  </div>
</div>


<script>
// ── SAMPLE SEED DATA ──
const samplePosts = [
  {
    id: 1,
    user: 'نورة القحطاني',
    initials: 'نق',
    region: 'Asir',
    time: 'قبل ساعتين',
    text: "قضيت الصبح مع جدتي في رجال ألمع نرسم القط العسيري والله إن الحيطان تتكلم. كل نقشة وكل لون يحكي عن عائلة ووادي وموسم. الفن هذا اليونسكو سجلته من 2017 كتراث إنساني، وجدتي تسوّيه من وهي صغيرة بدون ما تشوف ورقة ولا مرجع. المواد طبيعية: طين وصبغات من النباتات. فخورة إني من عسير.",
    image: 'https://commons.wikimedia.org/wiki/Special:FilePath/Al-Qatt_Al-Asiri_Art.jpg',
    likes: 312,
    liked: false,
    comments: [
      { user: 'تركي العسيري', text: "يا حلاة رجال ألمع، أمي لين اليوم ترسم سقف المجلس بنفس الطريقة" },
      { user: 'ليلى محمد', text: "عسير جنة، الرحلة الجاية أكيد لها" },
      { user: 'سلطان ع.', text: "الله يحفظ الجدات، هن اللي حافظين التراث" }
    ]
  },
  {
    id: 2,
    user: 'عبدالعزيز السديري',
    initials: 'عس',
    region: 'Riyadh',
    time: 'قبل 5 ساعات',
    text: "زرت حي الطريف في الدرعية أمس مع العيال هذا مو بس مبنى طين، هذا جذر الدولة السعودية الأولى. كل طوفة فيه تحكي قصة من 1446 ميلادي. اليونسكو سجّلته 2010 كتراث عالمي، واليوم صار الدرعية مشروع ضخم يرجع للمكان هيبته. روحوا وقت المغرب، النور على الطين شي ما ينوصف.",
    image: 'https://commons.wikimedia.org/wiki/Special:FilePath/At-Turaif_District_of_Diriyah,_Saudi_Arabia.jpg',
    likes: 487,
    liked: true,
    comments: [
      { user: 'خالد الراشد', text: "المكان يفتح النفس، وقصة الإمام محمد بن سعود تحس فيها وأنت ماشي" },
      { user: 'سارة ح.', text: "ما شاء الله، الدرعية اليوم غير قبل خمس سنين" },
      { user: 'عمر ف.', text: "الهندسة النجدية نظيفة، بسيطة وقوية" }
    ]
  },
  {
    id: 3,
    user: 'فيصل الشراري',
    initials: 'فش',
    region: 'Al Jawf',
    time: 'قبل يوم',
    text: "الدحّة الجوفية ما توصف، لازم تعاش ليلة أمس اجتمعنا في سكاكا، صفّين متقابلين والأصوات تهز الديرة. هذي رقصة الأجداد قبل الحروب، يا هلا بكم وقت الفزعة. إذا ما شفت الدحة في ليلة باردة عند قصر زعبل، ما عرفت الجوف صح. الإيقاع يدخل القلب قبل الأذن.",
    youtube: 'j9eyVMiEp-E',
    likes: 256,
    liked: false,
    comments: [
      { user: 'منصور الرويلي', text: "الدحة هوية، الله يديمها فينا" },
      { user: 'ريم ع.', text: "الجوف ما عليها كلام، تراث وتاريخ من قصر مارد لين دومة الجندل" }
    ]
  }
];

let posts = [...samplePosts];
let nextId = 100;

// ── RENDER FEED ──
function renderFeed() {
  const feed = document.getElementById('feed');
  feed.innerHTML = posts.map(renderPost).join('');
  // re-apply language translations on freshly-rendered nodes
  if (typeof applyLanguage === 'function') applyLanguage();
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderPost(p) {
  const initials = esc(p.initials);
  return `
    <article class="post-card" data-id="${p.id}">
      <div class="post-head">
        <div class="avatar">${initials}</div>
        <div class="post-meta">
          <div class="post-user">
            ${esc(p.user)}
            <span class="region-pill">${esc(p.region)}</span>
          </div>
          <div class="post-time">${esc(p.time)}</div>
        </div>
      </div>
      <div class="post-text" dir="auto">${esc(p.text)}</div>
      ${p.image ? `<div class="post-image"><img src="${esc(p.image)}" alt="Post image"></div>` : ''}
      ${p.youtube ? `<div class="post-video"><iframe src="https://www.youtube.com/embed/${esc(p.youtube)}" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>` : ''}
      ${p.video ? `<div class="post-video"><video src="${esc(p.video)}" controls playsinline></video></div>` : ''}
      ${p.audio ? `<div class="post-audio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg><audio src="${esc(p.audio)}" controls></audio></div>` : ''}
      <div class="post-actions">
        <button class="action-btn ${p.liked ? 'liked' : ''}" onclick="toggleLike(${p.id})">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
          <span>${p.likes}</span>
        </button>
        <button class="action-btn" onclick="toggleComments(${p.id})">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5V14a2.5 2.5 0 0 1-2.5 2.5H10L6 20v-3.5h-.5A2.5 2.5 0 0 1 4 14z"/></svg>
          <span>${p.comments.length}</span>
        </button>
      </div>
      <div class="comments" id="comments-${p.id}">
        ${p.comments.map(c => `
          <div class="comment">
            <div class="avatar">${esc(c.user.split(' ').map(w=>w[0]).slice(0,2).join(''))}</div>
            <div class="comment-body">
              <div class="comment-user" dir="auto">${esc(c.user)}</div>
              <div class="comment-text" dir="auto">${esc(c.text)}</div>
            </div>
          </div>
        `).join('')}
        <div class="comment-input-row">
          <input type="text" class="comment-input" id="comment-input-${p.id}"
            placeholder="Write a comment..."
            data-en-placeholder="Write a comment..."
            data-ar-placeholder="اكتب تعليق..."
            onkeydown="if(event.key==='Enter') sendComment(${p.id})">
          <button class="comment-send translatable" onclick="sendComment(${p.id})" data-en="Send" data-ar="إرسال">Send</button>
        </div>
      </div>
    </article>
  `;
}

// ── INTERACTIONS ──
function toggleLike(id) {
  const p = posts.find(x => x.id === id);
  if (!p) return;
  p.liked = !p.liked;
  p.likes += p.liked ? 1 : -1;
  renderFeed();
}

function toggleComments(id) {
  const el = document.getElementById('comments-' + id);
  if (el) el.classList.toggle('open');
}

function sendComment(id) {
  const input = document.getElementById('comment-input-' + id);
  if (!input || !input.value.trim()) return;
  const p = posts.find(x => x.id === id);
  p.comments.push({ user: 'You', text: input.value.trim() });
  renderFeed();
  // keep comments open
  document.getElementById('comments-' + id).classList.add('open');
}

// ── COMPOSER ──
function openComposer() {
  document.getElementById('composer-overlay').classList.add('open');
}
function closeComposer() {
  document.getElementById('composer-overlay').classList.remove('open');
  document.getElementById('composer-text').value = '';
  document.getElementById('composer-region').value = '';
  document.getElementById('composer-youtube').value = '';
  removePreview();
}

let pendingMedia = { image: null, video: null, audio: null };
function previewMedia(e, kind) {
  const file = e.target.files[0];
  if (!file) return;
  // Clear other pending media so only one attachment at a time
  pendingMedia = { image: null, video: null, audio: null };
  ['image','video','audio'].forEach(k => {
    if (k !== kind) document.getElementById('composer-' + k).value = '';
  });
  const reader = new FileReader();
  reader.onload = ev => {
    const data = ev.target.result;
    pendingMedia[kind] = data;
    const imgEl = document.getElementById('img-preview-el');
    const vidEl = document.getElementById('video-preview-el');
    const audWrap = document.getElementById('audio-preview-wrap');
    const audEl = document.getElementById('audio-preview-el');
    imgEl.style.display = kind === 'image' ? 'block' : 'none';
    vidEl.style.display = kind === 'video' ? 'block' : 'none';
    audWrap.style.display = kind === 'audio' ? 'block' : 'none';
    if (kind === 'image') imgEl.src = data;
    if (kind === 'video') vidEl.src = data;
    if (kind === 'audio') audEl.src = data;
    document.getElementById('img-preview').classList.add('show');
  };
  reader.readAsDataURL(file);
}
function removePreview() {
  pendingMedia = { image: null, video: null, audio: null };
  ['image','video','audio'].forEach(k => {
    const el = document.getElementById('composer-' + k);
    if (el) el.value = '';
  });
  const imgEl = document.getElementById('img-preview-el');
  const vidEl = document.getElementById('video-preview-el');
  const audEl = document.getElementById('audio-preview-el');
  if (imgEl) { imgEl.src = ''; imgEl.style.display = 'none'; }
  if (vidEl) { vidEl.pause?.(); vidEl.src = ''; vidEl.style.display = 'none'; }
  if (audEl) { audEl.pause?.(); audEl.src = ''; }
  document.getElementById('audio-preview-wrap').style.display = 'none';
  document.getElementById('img-preview').classList.remove('show');
}

function parseYouTubeId(url) {
  if (!url) return null;
  const patterns = [
    /[?&]v=([a-zA-Z0-9_-]{11})/,
    /youtu\.be\/([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/
  ];
  for (const re of patterns) {
    const m = url.match(re);
    if (m) return m[1];
  }
  return null;
}

function submitPost() {
  const text = document.getElementById('composer-text').value.trim();
  const region = document.getElementById('composer-region').value;
  const ytUrl = document.getElementById('composer-youtube').value.trim();
  const ytId = parseYouTubeId(ytUrl);
  if (ytUrl && !ytId) {
    alert(window.currentLang === 'ar'
      ? 'رابط اليوتيوب غير صحيح'
      : 'Invalid YouTube link');
    return;
  }
  if (!text || !region) {
    alert(window.currentLang === 'ar'
      ? 'اكتب منشور واختر منطقتك'
      : 'Write something and pick a region');
    return;
  }
  posts.unshift({
    id: nextId++,
    user: 'You',
    initials: 'YO',
    region,
    time: window.currentLang === 'ar' ? 'الآن' : 'now',
    text,
    image: pendingMedia.image,
    video: pendingMedia.video,
    audio: pendingMedia.audio,
    youtube: ytId,
    likes: 0,
    liked: false,
    comments: []
  });
  closeComposer();
  renderFeed();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// close composer on backdrop click
document.getElementById('composer-overlay').addEventListener('click', e => {
  if (e.target.id === 'composer-overlay') closeComposer();
});

// initial render
renderFeed();
</script>
