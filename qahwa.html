<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#110A07">
<title>Saudi Coffee — CultureLens</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="qahwa.css">
<link rel="stylesheet" href="studio.css">
</head>
<body class="qx">

<!-- The Saudi Coffee experience. Everything below the header is drawn by qahwa.js:
     1. History (#story)   2. How it's made, in AR (#brew)   3. The game (#game) -->
<header class="qx-top">
  <a class="qx-icon-btn" id="qx-close" href="experience.html?x=qahwa" aria-label="Close"></a>
  <div class="qx-top-title translatable" data-en="Saudi Coffee" data-ar="القهوة السعودية">Saudi Coffee</div>
  <div class="qx-top-actions">
    <button class="qx-icon-btn" id="qx-sound" type="button" aria-label="Sound"></button>
    <button id="lang-toggle" type="button" onclick="toggleLanguage()"><span id="lang-label">العربية</span></button>
  </div>
</header>

<nav class="qx-parts" id="qx-parts" aria-label="Experience parts">
  <button class="qx-part" type="button" data-part="story"><span class="n">1</span><span class="translatable" data-en="History" data-ar="القصة">History</span><i class="bar"><b></b></i></button>
  <button class="qx-part" type="button" data-part="brew"><span class="n">2</span><span class="translatable" data-en="How it's made" data-ar="التحضير">How it's made</span><i class="bar"><b></b></i></button>
  <button class="qx-part" type="button" data-part="game"><span class="n">3</span><span class="translatable" data-en="The game" data-ar="اللعبة">The game</span><i class="bar"><b></b></i></button>
</nav>

<main class="qx-main" id="qx-main"></main>
<div class="qx-bar" id="qx-bar"></div>
<div class="qx-toast" id="qx-toast" role="status"></div>

<script src="language.js"></script>
<script src="patterns.js"></script>
<script src="content.js"></script>
<script src="ThemeManager.js"></script>
<script src="qahwa-art.js"></script>
<script src="qahwa.js"></script>
</body>
</html>
