<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0B1A">
<title>My Account — CultureLens</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
<style>
  .page-wrap { padding: 26px 20px 30px; }
  /* the profile */
  .profile-header { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 16px; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--ink); }
  .avatar-wrap { position: relative; width: 76px; height: 76px; }
  .avatar-lg { width: 76px; height: 76px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--night); color: var(--logo-cream); font-size: 26px; font-weight: 700; }
  .avatar-lg img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-cam { position: absolute; inset-inline-end: -4px; bottom: -4px; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--paper); border: 1px solid var(--rule); color: var(--ink); cursor: pointer; }
  .avatar-cam svg { width: 16px; height: 16px; }
  .avatar-cam input { display: none; }
  .display-name { font-size: 26px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; outline: none; }
  html[dir="rtl"] .display-name { letter-spacing: 0; font-weight: 700; }
  .display-name:focus { box-shadow: 0 1.5px 0 var(--acc); }
  .handle { font-size: 13.5px; color: var(--ink-3); margin-top: 2px; }
  .bio { font-size: 14.5px; line-height: 1.5; color: var(--ink-2); margin-top: 6px; outline: none; }
  .bio:focus { box-shadow: 0 1.5px 0 var(--acc); }
  .profile-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; }
  .region-pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border: 1px solid var(--rule); border-radius: var(--r); font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .region-pill::before { content: ''; width: 6px; height: 6px; background: var(--acc); }
  .player-level { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }

  .section { margin-top: 34px; }
  .section-title { margin-bottom: 14px; }
  .section-title > span:first-child { font-size: 22px; font-weight: 750; letter-spacing: -0.02em; }
  html[dir="rtl"] .section-title > span:first-child { letter-spacing: 0; }
  .section-title > span:first-child { display: block; }
  .section-title small { display: block; margin-top: 3px; font-size: 13px; color: var(--ink-3); }

  /* the collection: the full experiences, with their pictures */
  .collection { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .coll-item { display: block; color: var(--ink); }
  .coll-item .coll-pic { position: relative; aspect-ratio: 1 / 1; border-radius: var(--r); overflow: hidden; background: var(--paper-3); }
  .coll-item .coll-pic img { width: 100%; height: 100%; object-fit: cover; }
  .coll-item:not(.is-earned) .coll-pic img { filter: grayscale(0.7); opacity: 0.75; }
  .coll-item b { display: block; margin-top: 8px; font-size: 15.5px; line-height: 1.25; font-weight: 700; }
  .coll-item small { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
  .coll-item .xp-stars { margin: 4px 0 0; }

  .posts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .post-tile { aspect-ratio: 1 / 1; border-radius: var(--r); overflow: hidden; background: var(--paper-2); border: 1px solid var(--rule-2); }
  .post-tile img { width: 100%; height: 100%; object-fit: cover; }
  .post-tile-text { padding: 14px; font-size: 14px; line-height: 1.5; color: var(--ink); }

  .settings-list { border-top: 1px solid var(--ink); }
  .setting-row { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px; padding: 0 2px; border-bottom: 1px solid var(--rule); text-align: start; }
  .setting-row:active { background: var(--paper-2); }
  .setting-label { font-size: 15.5px; font-weight: 600; }
  .setting-value { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-3); }
  .chev { width: 16px; height: 16px; color: var(--ink-3); }
  .toggle { position: relative; width: 40px; height: 24px; border-radius: 12px; background: var(--paper-3); transition: background 0.2s; }
  .toggle::after { content: ''; position: absolute; top: 3px; inset-inline-start: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--paper); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); transition: transform 0.2s var(--ease); }
  .toggle.on { background: var(--acc); }
  .toggle.on::after { transform: translateX(16px); }
  html[dir="rtl"] .toggle.on::after { transform: translateX(-16px); }
  .setting-row.danger .setting-label { color: #9B392E; }
</style>
</head>
<body class="cl-app">

<header class="cl-header">
  <div class="hdr-start">
    <a href="index.html" class="back-btn" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <a class="brand is-mark" href="index.html" aria-label="CultureLens"><img src="logo-mark.svg" alt=""></a>
  </div>
  <div class="hdr-actions">
    <button id="lang-toggle" type="button" onclick="toggleLanguage()"><span id="lang-label">العربية</span></button>
  </div>
</header>

<main class="page-wrap">

  <!-- PROFILE HEADER -->
  <section class="profile-header">
    <div class="avatar-wrap">
      <div class="avatar-lg" id="avatar-lg">
        <span id="avatar-initials">YO</span>
      </div>
      <label class="avatar-cam" aria-label="Change profile picture">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.2"/><path d="M8.5 7l1.3-2h4.4l1.3 2"/></svg>
        <input type="file" accept="image/*" onchange="changeAvatar(event)">
      </label>
    </div>
    <div class="profile-text">
    <div class="display-name translatable" id="display-name" contenteditable="true" spellcheck="false" data-en="Your Name" data-ar="اسمك">Your Name</div>
    <div class="handle"><bdi>@yourhandle</bdi></div>
    <div class="bio translatable" id="bio" contenteditable="true" spellcheck="false" data-en="Curious about Saudi heritage, always learning." data-ar="مهتم بالتراث السعودي، ودايماً أتعلم.">Curious about Saudi heritage, always learning.</div>
    <div class="profile-tags">
      <span class="region-pill translatable" data-en="Najd" data-ar="نجد">Najd</span>
      <span class="player-level" id="player-level"></span>
    </div>
    </div>
  </section>

  <!-- YOUR COLLECTION: a medal for each full experience, from real progress -->
  <section class="section">
    <div class="section-title">
      <span class="translatable" data-en="Your collection" data-ar="مجموعتك">Your collection</span>
      <small class="translatable" data-en="The full experiences, and your stars in each" data-ar="التجارب الكاملة، ونجومك في كل وحدة">The full experiences, and your stars in each</small>
    </div>
    <div class="collection" id="collection"></div>
  </section>

  <!-- MY POSTS -->
  <section class="section">
    <div class="section-title">
      <span class="translatable" data-en="My Posts" data-ar="منشوراتي">My Posts</span>
      <small class="translatable" data-en="From the community feed" data-ar="من مجتمع التطبيق">From the community feed</small>
    </div>
    <div class="posts-grid">
      <div class="post-tile"><img src="mudhouse.png" alt="Post image"></div>
      <div class="post-tile">
        <div class="post-tile-text translatable" data-en="Hosted my first Najdi majlis last night. Uncle nodded." data-ar="ضيّفت أول مجلس نجدي أمس. العم رضى بهزة راس.">Hosted my first Najdi majlis last night. Uncle nodded.</div>
      </div>
      <div class="post-tile">
        <div class="post-tile-text translatable" data-en="Recording oud with my father. Maqams are passed on only by hand." data-ar="سجلت عود مع والدي. مقامات ما تنتقل إلا باليد.">Recording oud with my father. Maqams are passed on only by hand.</div>
      </div>
      <div class="post-tile"><img src="dallah.png" alt="Post image"></div>
    </div>
  </section>

  <!-- SETTINGS -->
  <section class="section">
    <div class="section-title">
      <span class="translatable" data-en="Settings" data-ar="الإعدادات">Settings</span>
    </div>
    <div class="settings-list">
      <button class="setting-row" onclick="toggleLanguage()">
        <span class="setting-label translatable" data-en="Language" data-ar="اللغة">Language</span>
        <span class="setting-value">
          <span id="lang-value">English</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </button>

      <button class="setting-row" onclick="openRegionPicker()">
        <span class="setting-label translatable" data-en="Home Region" data-ar="المنطقة الأصلية">Home Region</span>
        <span class="setting-value">
          <span id="region-value">Riyadh</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </button>

      <button class="setting-row" onclick="toggleNotifications(this)">
        <span class="setting-label translatable" data-en="Notifications" data-ar="الإشعارات">Notifications</span>
        <span class="setting-value">
          <span class="toggle on" id="notif-toggle"></span>
        </span>
      </button>

      <button class="setting-row" onclick="openAbout()">
        <span class="setting-label translatable" data-en="About CultureLens" data-ar="عن عدسة ثقافية">About CultureLens</span>
        <span class="setting-value"><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
      </button>

      <button class="setting-row danger" onclick="signOut()">
        <span class="setting-label translatable" data-en="Sign Out" data-ar="تسجيل الخروج">Sign Out</span>
        <span class="setting-value"><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
      </button>
    </div>
  </section>

</main>


<script>
// ── AVATAR UPLOAD ──
function changeAvatar(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const wrap = document.getElementById('avatar-lg');
    wrap.innerHTML = `<img src="${ev.target.result}" alt="Profile picture">`;
  };
  reader.readAsDataURL(file);
}

// ── EDITABLE NAME → UPDATE INITIALS ──
document.getElementById('display-name').addEventListener('blur', () => {
  const name = document.getElementById('display-name').textContent.trim() || 'You';
  const initials = name.split(/\s+/).map(w => w[0] || '').slice(0,2).join('').toUpperCase() || 'YO';
  const el = document.getElementById('avatar-initials');
  if (el) el.textContent = initials;
});

// ── SETTINGS ──
function toggleNotifications(btn) {
  const t = btn.querySelector('.toggle');
  t.classList.toggle('on');
}

const regions = [
  'Riyadh','Makkah','Madinah','Eastern Province','Asir','Tabuk',
  'Hail','Northern Borders','Jizan','Najran','Al Bahah','Al Jawf','Qassim'
];
function openRegionPicker() {
  const current = document.getElementById('region-value').textContent;
  const choice = prompt(
    (window.currentLang === 'ar' ? 'اكتب اسم منطقتك:\n' : 'Type your home region:\n') + regions.join(', '),
    current
  );
  if (choice && regions.some(r => r.toLowerCase() === choice.trim().toLowerCase())) {
    const matched = regions.find(r => r.toLowerCase() === choice.trim().toLowerCase());
    document.getElementById('region-value').textContent = matched;
  }
}

function openAbout() {
  alert(window.currentLang === 'ar'
    ? 'عدسة ثقافية — تطبيق تفاعلي يعرّفك على ثقافات مناطق السعودية.'
    : 'CultureLens — an interactive app that immerses you in the cultures of Saudi Arabia\'s regions.');
}

function signOut() {
  if (confirm(window.currentLang === 'ar' ? 'متأكد تبغى تسجل خروج؟' : 'Are you sure you want to sign out?')) {
    window.location.href = 'index.html';
  }
}

// reflect current language in the settings row label
document.addEventListener('DOMContentLoaded', () => {
  const updateLangLabel = () => {
    const el = document.getElementById('lang-value');
    if (el) el.textContent = window.currentLang === 'ar' ? 'العربية' : 'English';
  };
  updateLangLabel();
  // observe future lang-label changes
  const langLabel = document.getElementById('lang-label');
  if (langLabel) new MutationObserver(updateLangLabel).observe(langLabel, { childList: true, subtree: true });
});
</script>

<script src="language.js"></script>
<script src="patterns.js"></script>
<script src="content.js"></script>
<script src="keyart.js"></script>
<script src="ThemeManager.js"></script>
<script>window.ACTIVE_NAV = 'account';</script>
<script src="navbar.js"></script>
<script>
// Your collection and level, from the progress the experiences save (cl_progress)
(function () {
  var TM = window.ThemeManager, KA = window.CLKeyArt;
  if (!TM || !KA || !document.getElementById('collection')) return;
  var CAT = TM.CATALOG, R = TM.REGIONS;
  function prog() { try { return JSON.parse(localStorage.getItem('cl_progress') || '{}'); } catch (e) { return {}; } }
  function ar() { return window.currentLang === 'ar'; }
  function n(x) { return ar() ? String(x).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; }) : String(x); }
  function stars(k) { var h = '<span class="xp-stars">'; for (var i = 0; i < 3; i++) h += '<i class="' + (i < k ? 'on' : '') + '"></i>'; return h + '</span>'; }
  function render() {
    var p = prog(), ids = Object.keys(CAT).filter(function (id) { return CAT[id].page; }), total = 0;
    document.getElementById('collection').innerHTML = ids.map(function (id) {
      var it = CAT[id], st = p[id] ? (p[id].stars || 0) : 0, home = it.regions[0] === 'all' ? 'najd' : it.regions[0];
      total += st;
      var where = R[home] ? (ar() ? R[home].nameAr : R[home].nameEn) : '';
      var status = p[id] ? stars(st) : '<small>' + (ar() ? 'ما لعبتها للحين' : 'Not played yet') + '</small>';
      var pic = it.cover ? '<img src="' + it.cover + '" alt="" loading="lazy">' : '';
      return '<a class="coll-item' + (p[id] ? ' is-earned' : '') + '" href="experience.html?x=' + id + '"><div class="coll-pic">' + pic + '</div>' +
        '<b>' + (ar() ? it.name.ar : it.name.en) + '</b><small>' + where + '</small>' + status + '</a>';
    }).join('');
    var max = ids.length * 3;
    document.getElementById('player-level').textContent = (ar() ? n(total) + ' من ' + n(max) + ' نجمة' : total + ' of ' + max + ' stars');
    var key = TM.current(), pill = document.querySelector('.region-pill');
    if (pill && key && R[key]) { pill.setAttribute('data-en', R[key].nameEn); pill.setAttribute('data-ar', R[key].nameAr); pill.textContent = ar() ? R[key].nameAr : R[key].nameEn; }
  }
  render();
  document.addEventListener('languageChanged', render);
})();
</script>
</body>
</html>
