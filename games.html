<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14100D">
<title>Traditional Games — CultureLens</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="studio.css">
</head>
<body>

<header class="cl-header">
  <a href="index.html" class="back-btn" aria-label="Back">‹</a>
  <div style="display:flex;align-items:center;gap:8px;">
    <button id="lang-toggle" type="button" onclick="toggleLanguage()"><span id="lang-label">العربية</span></button>
  </div>
</header>

<main class="hub">
  <div class="hub-band" data-motif="full" data-motif-scale="1.25" aria-hidden="true"></div>
  <div class="hub-head">
    <div class="kicker" data-region-text="name"></div>
    <h1 class="translatable" data-en="Traditional Games" data-ar="الألعاب القديمة">Traditional Games</h1>
    <p class="translatable" data-en="The games of the old neighborhoods, played the way our parents played them." data-ar="ألعاب الحارة القديمة، مثل ما لعبها أهلنا.">The games of the old neighborhoods, played the way our parents played them.</p>
    <div class="hub-note"></div>
  </div>

  <!-- Rows come from the CATALOG in ThemeManager.js (cat: 'games') -->
  <div class="xp-list" data-category="games"></div>
</main>

<script src="language.js"></script>
<script src="patterns.js"></script>
<script src="content.js"></script>
<script src="keyart.js"></script>
<script src="ThemeManager.js"></script>
<script>window.ACTIVE_NAV = 'explore';</script>
<script src="navbar.js"></script>
</body>
</html>
